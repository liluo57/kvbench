# Global dataset configuration.
#
# DatasetPath is the root directory that holds every benchmark dataset, one
# subdirectory per dataset. A task resolves a dataset *name* against this root,
# e.g. NIAHTask(dataset="ruler") reads its samples from
#   <DatasetPath>/ruler
# and MusiqueTask(dataset="musique") from
#   <DatasetPath>/musique
#
# Layout expected under DatasetPath:
#   ruler/     the genuine RULER benchmark (Hsieh et al., COLM 2024), one jsonl
#              per (task, length) family, e.g. niah_len4096.jsonl,
#              vt_len8192.jsonl, cwe_len8192.jsonl ...
#              (fields: index, input, outputs, length, length_w_model_temp,
#               answer_prefix, token_position_answer; NIAH additionally carries
#               needle + depth_percent). Generated by GenerateRuler.py.
#   musique/   cacheblend's multi-hop QA dataset (musique_s.json / .jsonl)
#              (fields: ctxs[{title,text}], question, answers)
#   samsum/    cacheblend's summarization dataset (samsum.json)
#   wikimqa/   cacheblend's wiki multi-hop QA dataset (wikimqa_s.json)
DatasetPath: /data/lyh/kvbench/data

# Default model used by the methods when none is passed explicitly.
ModelPath: /data/lyh/.cache/modelscope/hub/models/Qwen/Qwen3-8B

# The CacheblendRepo method (methods/CacheblendRepo.py) runs the *original*
# CacheBlend repo (YaoJiayi/CacheBlend): a patched vLLM 0.4.1 whose collect /
# check / fusion machinery lives in <RepoPath>/vllm_blend. The method launches a
# worker subprocess under <RepoPath>/.venv/bin/python, so neither path may be
# omitted — the constructor raises if either is missing.
Cacheblend:
  Repo:
    # The original CacheBlend repo clone (holds vllm_blend + .venv).
    RepoPath: /data/lyh/cache-blend/CacheBlend


# SkillsBench + mini-SWE integration for AgentBenchFlowTask.
AgentBenchFlow:
  # Root of the cloned SkillsBench repo (must contain tasks/<id>/task.md).
  # Cloned from https://github.com/benchflow-ai/skillsbench.
  SkillsBenchRepo: /data/lyh/skillsbench

  # Where the agent and verifier run. Options:
  #   "docker" (default): builds the task's environment/Dockerfile and runs
  #     both in containers. Production path when Docker daemon is available.
  #   "apptainer": rootless — no Docker daemon, no sudo. Pulls the task's
  #     base image (the FROM line of environment/Dockerfile) as a SIF and
  #     runs agent + verifier with bind mounts. The Dockerfile's RUN/COPY
  #     steps are NOT applied (apptainer build needs newuidmap/fuse-overlayfs
  #     which we don't have); the task's per-image deps must already be in
  #     the base image, or staged via /host_tools (the Helper bind-mounts
  #     the host's mini-swe-agent into the container automatically).
  #   "local": runs everything on the host without isolation; only for
  #     dev / smoke testing the HTTP plumbing.
  SandboxType: apptainer

  # CLI binary invoked inside the sandbox. mini-swe-agent is the 100-line
  # Python agent from SWE-agent/mini-swe-agent (Princeton/Stanford SWE-bench
  # team); it talks to any OpenAI-compatible endpoint via litellm, so we
  # point it at our kvbench-backed HTTP server with OPENAI_API_BASE.
  AgentCommand: mini-swe-agent

  # Sandbox image override (apptainer only). When the apptainer sandbox can't
  # apply the task's Dockerfile RUN/COPY steps (rootless install without
  # newuidmap/fakeroot), set one of these to skip the Dockerfile entirely
  # and pull a pre-built image instead.
  #
  # ImageOverride:    single URI used for every task.
  # ImageOverrides:   per-task dict; overrides ImageOverride if the task id
  #                   is present. Useful when only some SkillsBench tasks
  #                   need a custom base (e.g. python:3.11-slim for
  #                   citation-check, while others might be fine on the
  #                   default FROM line of their Dockerfile).
  #
  # Default (null): apptainer parses the FROM line of the task's Dockerfile.
  # ImageOverride: null
  # ImageOverrides: {}

  # Where each case writes its per-rollout output files (agent log, verifier
  # log, synthetic result.json, agent + verifier workspaces, trajectory).
  # Each SkillsBench task gets its own subdir under this tree. Set to null
  # for a fresh tempdir per case.
  OutputDir: /data/lyh/kvbench/outputs/benchflow

  # Seconds to wait for the agent + verifier to finish inside the sandbox.
  # Engine.taskTimeout is the outer bound.
  ResultJsonTimeoutSec: 3600

  # Extra flags appended to the agent CLI invocation. Use for anything
  # mini-swe-agent's CLI accepts beyond --task / --model / --yolo /
  # --exit-immediately / --cost-limit (which the Helper sets).
  AgentExtraArgs: []
