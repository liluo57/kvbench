# Hugging Face model id; replace with a local checkpoint path if preferred.
ModelPath: mistralai/Mistral-7B-Instruct-v0.3

# Shared context-window limit used by every model backend.
MaxModelLen: 32768

# Shared model sampling policy.
#   greedy   - deterministic argmax decoding
#   default  - use the model's generation_config.json (or config.json)
#   override - use the sampling values listed below
ModelConfig:
  mode: greedy
  temperature: 1.0
  top_p: 0.95
  top_k: 20

FullPrefillVllm:
  MaxNumSeqs: 32

# HYPIC and LinearKV are bundled in methods/hypic and share the project Python.
# Run ./setup.py --hypic to install dependencies and build the retained CUDA ops.
Hypic:
  # Cap the mamba / linear-attention state pool size per rank. SGLang's
  # auto-fit (mamba_full_memory_ratio=0.9) defaults to ~300 slots, which on
  # Qwen3.5-35B eats ~47 GiB per GPU and leaves no room for prefill workspace.
  # PIC PICache segment count rarely exceeds a few dozen in practice; 32 is
  # safe for the current agent tasks. Set to -1 to fall back to SGLang's
  # auto-fit. The default when this key is absent is 32.
  MaxMambaCacheSize: 32

Engine:
  AvailableGpuIds: 'auto'
  BatchSize: 1
  RecordAllSamples: false
  OutputRoot: outputs
  InitializeTimeoutSec: 6000
  TaskTimeoutSec: 18000
  ShutdownGracePeriodSec: 30
  GpuReleaseTimeoutSec: 30
  GpuReleaseStableSeconds: 1
  GpuReleaseMemoryToleranceMiB: 256
  PairRetries: 0
  Tui: true
  TuiWaitForQuit: true
  Verbose: true

# CacheBlend's vLLM 0.4.1 backend is bundled in methods/Cacheblend/backend.
# Run `./setup.py --cacheblend` to install it in the main project environment.
Cacheblend:
  GpuMemoryUtilization: 0.7
  # Defaults to the project's current Python. Relative overrides use the root.
  # Python: /path/to/project/python

# A^3 is bundled in methods/A3Repo; ./setup.py --a3 installs optional dependencies.
# Its isolated worker defaults to the current project Python.
A3:
  # Python: /path/to/project/python
  Python:

# KVPacket's packet code is vendored under methods/KVPacket; its HF/cache backend
# is shared with Rand/FullRecompute and standalone EPIC in helpers/backends/CacheBackend.
# These controls use native token IDs and need no trained wrapper or external repo.
# KVPacket shares the main
# Python 3.12 or 3.13 / PyTorch / Transformers environment. Run `./setup.py --kvpacket`
# to check that environment; it does not install or replace shared packages.
KVPacket:
  # A trained PacketTrainer checkpoint must match the configured ModelPath.
  # Relative paths resolve from the project root. Leave unset until a matching
  # trained wrapper is available; initialization then fails clearly.
  WrapperCheckpointPath:
  WrapperId: document
  # Required only for legacy header/trailer tensor checkpoints without embedded
  # fingerprints. Set to the exact HF config._name_or_path loaded at runtime
  # (a Hub ID or exact local directory) and verify it names the training source.
  # Legacy files do not record a revision or weight digest.
  WrapperModelId:
  HeaderLen: 8
  TrailerLen: 8
  Match: token
  # Set true only for plumbing smoke tests; random wrappers are untrained and
  # their quality/latency results do not represent trained KVPacket.
  AllowUntrainedWrapper: false

# Global dataset configuration.
#
# DatasetPath is the root directory that holds every benchmark dataset, one
# subdirectory per dataset. A task resolves a dataset *name* against this root,
# e.g. NIAHTask(dataset="ruler") reads its samples from
#   <DatasetPath>/ruler
# and MusiqueTask(dataset="musique") from
#   <DatasetPath>/musique
DatasetPath: data

# Dataset preparation is deliberately configuration-driven.  PrepareDataset.py
# creates these datasets from the declared upstream sources; no benchmark data
# is expected to be committed to this repository.  The Hugging Face revisions
# pin the source snapshots so a fresh checkout is reproducible.
DatasetPreparation:
  # Only these directories are replaced after a successful preparation.  The
  # replacement also removes stale files such as old *.bak.jsonl snapshots.
  DatasetDirectories:
    - ruler
    - musique
    - samsum
    - 2wikimultihopqa
    - hotpotqa
    - govreport
    - multinews
    - triviaqa
    - mmlu
    - gsm8k
    - humaneval

  # Direct downloads use upstream benchmark releases. MuSiQue is downloaded
  # from the authors' archive; SAMSum from the paper's original corpus archive.
  # The adapters retain only each complete labeled evaluation split.
  Direct:
    - Output: musique/musique_ans_dev.jsonl
      GoogleDriveId: 1tGdADlNjWFaHLeZZGShh2IRcpO6Lv24h
      Format: musique_ans_dev_google_drive_zip
      ArchiveFile: data/musique_ans_v1.0_dev.jsonl
      ExpectedRows: 2417
    - Output: samsum/samsum_test.jsonl
      Url: https://arxiv.org/src/1911.12237v2/anc/corpus.7z
      Format: samsum_test_7z
      ArchiveFile: test.json
      ExpectedRows: 819
    - Output: 2wikimultihopqa/2wikimultihopqa_dev.json
      Url: https://www.dropbox.com/scl/fi/aasqsj45yokx71pnm8ctr/data_ids.zip?rlkey=72n2p6jywhfmm6kdeuzz8c55u&dl=1
      Format: 2wikimultihopqa_dev_zip
      ArchiveFile: data_ids/dev.json
      ExpectedRows: 12576
    - Output: govreport/govreport.jsonl
      Urls:
        - https://huggingface.co/datasets/launch/gov_report/resolve/32feeaede49fed993aef070bc4da09263fd0429a/data/gao_test.jsonl
        - https://huggingface.co/datasets/launch/gov_report/resolve/32feeaede49fed993aef070bc4da09263fd0429a/data/crs_test.jsonl
      Format: govreport_jsonl
      ExpectedRows: 973

  # These adapters materialize complete validation/test splits into the local
  # schemas consumed by KVBench.
  HuggingFace:
    - Dataset: hotpotqa/hotpot_qa
      Revision: 1908d6afbbead072334abe2965f91bd2709910ab
      Config: distractor
      Split: validation
      Adapter: hotpotqa
      Output: hotpotqa/hotpotqa.jsonl
      ExpectedRows: 7405
    - Dataset: Awesome075/multi_news_parquet
      Revision: c4d93d02c8ddeeae63bae98ed5b1e0a5e44396cd
      Split: test
      Adapter: multinews
      Output: multinews/multinews.jsonl
      ExpectedRows: 5622
    - Dataset: mandarjoshi/trivia_qa
      Revision: 0f7faf33a3908546c6fd5b73a660e0f8ff173c2f
      Config: rc
      Split: validation
      Adapter: triviaqa
      Output: triviaqa/triviaqa.jsonl
      ExpectedRows: 17944
    - Dataset: cais/mmlu
      Revision: c30699e8356da336a370243923dbaf21066bb9fe
      Config: all
      Split: test
      Adapter: mmlu
      Output: mmlu/test
      ExpectedRows: 14042
    - Dataset: openai/gsm8k
      Revision: 740312add88f781978c0658806c59bc2815b9866
      Config: main
      Split: test
      Adapter: gsm8k
      Output: gsm8k/gsm8k.jsonl
      ExpectedRows: 1319
    - Dataset: openai/openai_humaneval
      Revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
      Split: test
      Adapter: humaneval
      Output: humaneval/humaneval-py.jsonl
      ExpectedRows: 164

  # RULER generation consumes the exact tokenizer and limits declared above.
  # Its synthetic data is regenerated, not downloaded from a partial snapshot.
  Ruler:
    Tokenizer: ModelPath
    CorpusUrls: https://raw.githubusercontent.com/NVIDIA/RULER/c3f5e3b4f87f97e048793bb510a3a6b19a46bf3a/scripts/data/synthetic/json/PaulGrahamEssays_URLs.txt
    # english_words.json is Git-LFS-backed; media.githubusercontent.com resolves
    # the blob rather than returning the small LFS pointer file.
    WordList: https://media.githubusercontent.com/media/NVIDIA/RULER/c3f5e3b4f87f97e048793bb510a3a6b19a46bf3a/scripts/data/synthetic/json/english_words.json
    Tasks:
      - Task: niah
        Lengths: [4096, 8192]
        Samples: 500
        TokensToGenerate: 128
        Seed: 42
      - Task: vt
        Lengths: [4096, 8192]
        Samples: 500
        TokensToGenerate: 30
        Seed: 42
      - Task: cwe
        Lengths: [4096, 8192]
        Samples: 500
        TokensToGenerate: 120
        Seed: 42


AgentBenchFlow:
  SourceMode: local
  Dataset: skillsbench@1.1
  SkillsBenchRepo: ~/skillsbench

  # BenchFlow 0.7.5 currently provides pi-acp, opencode, and mimo, but not
  # qwen-code. pi-acp has the skill path needed for with-skill runs and uses
  # BenchFlow's normal ACP/provider routing.
  Agent: pi-acp
  Sandbox: remote-docker
  # BenchFlow modes: with-skill (normal) or no-skill.  WithoutSkill,
  # without-skill, and without_skill are accepted aliases for no-skill; in
  # that mode BenchFlow removes task-bundled skills from the agent sandbox.
  SkillMode: with-skill

  # To move BenchFlow + Docker to another runtime host, change Sandbox above
  # to remote-docker and start scripts/RemoteDockerRuntimeServer.py there.
  RemoteDocker:
    Endpoint: http://127.0.0.1:9000
    # Optional on one machine. For two machines, set this to an address of A
    # that B can reach; if omitted KVBench detects A's outbound interface.
    AuthTokenEnv: KVBENCH_REMOTE_TOKEN
    ConnectTimeoutSec: 10
    UploadTimeoutSec: 300
    PollIntervalSec: 1
    ArtifactDownloadRetries: 3

  # The endpoint binds to EndpointHost, while this host name is placed in the
  # provider URL. With BenchFlow 0.7.5's mandatory host LiteLLM proxy,
  # 127.0.0.1 is the correct upstream address from the host proxy to KVBench.
  # For a direct provider path, use host.docker.internal or the Linux Docker
  # host-gateway alias instead.
  ProviderHost: 127.0.0.1
  EndpointHost: 0.0.0.0
  # Remote-Docker over SSH needs every possible provider port forwarded. Each
  # concurrent worker claims one free port from this inclusive range.
  EndpointPortRange: [8000, 8031]
  ProviderApiKeyEnv: KVBENCH_PROVIDER_API_KEY

  # BenchFlow writes the official result.json and all rollout artifacts here.
  BenchCommand: bench
  OutputDir: outputs/benchflow
  ResultJsonTimeoutSec: 18000
  # Number of BenchFlow task retries after the initial attempt. Set to 0 to
  # disable BenchFlow's default retry loop; set to 2 for three total attempts.
  RetryAttempts: 0
  Thinking: true
  BenchExtraArgs:
    - --agent-idle-timeout
    - "18000"
    - --config-override
    - '{"agent":{"timeout_sec":18000}}'
    - --agent-env
    - REQUEST_TIMEOUT=18000
