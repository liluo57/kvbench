# Global dataset configuration.
#
# DatasetPath is the root directory that holds every benchmark dataset, one
# subdirectory per dataset. A task resolves a dataset *name* against this root,
# e.g. NIAHTask(dataset="ruler") reads its samples from
#   <DatasetPath>/ruler
# and MusiqueTask(dataset="musique") from
#   <DatasetPath>/musique
#
# Layout expected under DatasetPath:
#   ruler/     the genuine RULER benchmark (Hsieh et al., COLM 2024), one jsonl
#              per (task, length) family, e.g. niah_len4096.jsonl,
#              vt_len8192.jsonl, cwe_len8192.jsonl ...
#              (fields: index, input, outputs, length, length_w_model_temp,
#               answer_prefix, token_position_answer; NIAH additionally carries
#               needle + depth_percent). Generated by GenerateRuler.py.
#   musique/   cacheblend's multi-hop QA dataset (musique_s.json / .jsonl)
#              (fields: ctxs[{title,text}], question, answers)
#   samsum/    cacheblend's summarization dataset (samsum.json)
#   wikimqa/   cacheblend's wiki multi-hop QA dataset (wikimqa_s.json)
DatasetPath: /data/lyh/kvbench/data

# Default model used by the methods when none is passed explicitly.
ModelPath: /data/lyh/.cache/modelscope/hub/models/Qwen/Qwen3.8-27B

# The CacheblendRepo method (methods/CacheblendRepo.py) runs the *original*
# CacheBlend repo (YaoJiayi/CacheBlend): a patched vLLM 0.4.1 whose collect /
# check / fusion machinery lives in <RepoPath>/vllm_blend. The method launches a
# worker subprocess under <RepoPath>/.venv/bin/python, so neither path may be
# omitted — the constructor raises if either is missing.
Cacheblend:
  Repo:
    # The original CacheBlend repo clone (holds vllm_blend + .venv).
    RepoPath: /data/lyh/cache-blend/CacheBlend


# SkillsBench via the installed BenchFlow runtime.
AgentBenchFlow:
  # Dataset mode is the reproducible path. The local checkout below is used
  # only to enumerate task ids when task_ids is omitted.
  SourceMode: dataset
  Dataset: skillsbench@1.1
  SkillsBenchRepo: /data/lyh/skillsbench

  # BenchFlow 0.7.5 currently provides pi-acp, opencode, and mimo, but not
  # qwen-code. pi-acp has the skill path needed for with-skill runs and uses
  # BenchFlow's normal ACP/provider routing.
  Agent: pi-acp
  Sandbox: docker
  SkillMode: with-skill

  # The endpoint binds to EndpointHost, while this host name is placed in the
  # provider URL. With BenchFlow 0.7.5's mandatory host LiteLLM proxy,
  # 127.0.0.1 is the correct upstream address from the host proxy to KVBench.
  # For a direct provider path, use host.docker.internal or the Linux Docker
  # host-gateway alias instead.
  ProviderHost: 127.0.0.1
  EndpointHost: 0.0.0.0
  ProviderApiKeyEnv: KVBENCH_PROVIDER_API_KEY

  # BenchFlow writes the official result.json and all rollout artifacts here.
  BenchCommand: bench
  OutputDir: /data/lyh/kvbench/outputs/benchflow
  ResultJsonTimeoutSec: 3600
  Thinking: true
  BenchExtraArgs: []
