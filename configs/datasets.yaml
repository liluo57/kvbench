# Global dataset configuration.
#
# DatasetPath is the root directory that holds every benchmark dataset, one
# subdirectory per dataset. A task resolves a dataset *name* against this root,
# e.g. NIAHTask(dataset="ruler") reads its samples from
#   <DatasetPath>/ruler
# and MusiqueTask(dataset="musique") from
#   <DatasetPath>/musique
#
# Layout expected under DatasetPath:
#   ruler/     the genuine RULER benchmark (Hsieh et al., COLM 2024), one jsonl
#              per (task, length) family, e.g. niah_len4096.jsonl,
#              vt_len8192.jsonl, cwe_len8192.jsonl ...
#              (fields: index, input, outputs, length, length_w_model_temp,
#               answer_prefix, token_position_answer; NIAH additionally carries
#               needle + depth_percent). Generated by GenerateRuler.py.
#   musique/   cacheblend's multi-hop QA dataset (musique_s.json / .jsonl)
#              (fields: ctxs[{title,text}], question, answers)
#   samsum/    cacheblend's summarization dataset (samsum.json)
#   wikimqa/   cacheblend's wiki multi-hop QA dataset (wikimqa_s.json)
DatasetPath: /data/lyh/kvbench/data

# Default model used by the methods when none is passed explicitly.
# (Qwen2.5-7B-Instruct-1M, the model cacheblend's niah examples run on.)
ModelPath: /data/lyh/.cache/modelscope/models/Qwen--Qwen2.5-7B-Instruct-1M/snapshots/master

# (The cacheblend method no longer needs the *original* CacheBlend repo: it uses
# vLLM 0.25's built-in LMCache in-process blending. The old
# CacheBlendRepo / CacheBlendWorkerPython keys are obsolete and may be deleted.)

# The system vLLM is installed in the conda base env
# (vllm==0.25.1+cu129 + torch==2.11.0+cu129, a consistent CUDA stack). No
# LD_PRELOAD is needed; see pyproject.toml for how to reproduce the install.
